services:
  stocktracker:
    image: ghcr.io/kennycyho/stocktracker:latest
    env_file: .env
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: stocktracker
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d stocktracker" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data: